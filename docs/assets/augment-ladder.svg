<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 720 260" width="720" height="260"
     font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>The augment ladder, climbed</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="barDim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2b3a4a"/>
      <stop offset="1" stop-color="#4a3a2a"/>
    </linearGradient>
  </defs>

  <rect width="720" height="260" fill="#0f1115"/>
  <text x="24" y="26" fill="#e6e8ee" font-size="14" font-weight="600">The augment ladder</text>
  <text x="24" y="44" fill="#6b7488" font-size="11">+T is its own rung, one step below +T1 — they are consecutive, not synonyms.</text>

  <!-- baseline -->
  <line x1="60" y1="208" x2="660" y2="208" stroke="#272c37" stroke-width="1.4"/>

  <!-- bars: x = 70 + i*108, w = 48 -->
  <g>
    <rect x="70"  y="172" width="48" height="36"  rx="4" fill="url(#bar)"/>
    <rect x="178" y="145" width="48" height="63"  rx="4" fill="url(#bar)"/>
    <rect x="286" y="118" width="48" height="90"  rx="4" fill="url(#bar)"/>
    <rect x="394" y="91"  width="48" height="117" rx="4" fill="url(#bar)"/>
    <rect x="502" y="64"  width="48" height="144" rx="4" fill="url(#bar)"/>
    <rect x="610" y="37"  width="48" height="171" rx="4" fill="url(#bar)"/>
  </g>

  <!-- sequential pulse, bottom to top -->
  <g fill="#ffffff" opacity="0.18">
    <rect x="70"  y="172" width="48" height="36"  rx="4">
      <animate attributeName="opacity" values="0.22;0;0" dur="6s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect x="178" y="145" width="48" height="63"  rx="4">
      <animate attributeName="opacity" values="0.22;0;0" dur="6s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <rect x="286" y="118" width="48" height="90"  rx="4">
      <animate attributeName="opacity" values="0.22;0;0" dur="6s" repeatCount="indefinite" begin="2s"/>
    </rect>
    <rect x="394" y="91"  width="48" height="117" rx="4">
      <animate attributeName="opacity" values="0.22;0;0" dur="6s" repeatCount="indefinite" begin="3s"/>
    </rect>
    <rect x="502" y="64"  width="48" height="144" rx="4">
      <animate attributeName="opacity" values="0.22;0;0" dur="6s" repeatCount="indefinite" begin="4s"/>
    </rect>
    <rect x="610" y="37"  width="48" height="171" rx="4">
      <animate attributeName="opacity" values="0.22;0;0" dur="6s" repeatCount="indefinite" begin="5s"/>
    </rect>
  </g>

  <!-- the climbing path along the step tops -->
  <path id="climb" fill="none" stroke="none"
        d="M94,172 L94,145 L202,145 L202,118 L310,118 L310,91 L418,91 L418,64 L526,64 L526,37 L634,37"/>

  <circle r="6" fill="#ffffff">
    <animateMotion dur="6s" repeatCount="indefinite" begin="0s" rotate="auto">
      <mpath xlink:href="#climb" href="#climb"/>
    </animateMotion>
  </circle>
  <circle r="11" fill="#ffffff" opacity="0.25">
    <animateMotion dur="6s" repeatCount="indefinite" begin="0s">
      <mpath xlink:href="#climb" href="#climb"/>
    </animateMotion>
    <animate attributeName="opacity" values="0.28;0.05;0.28" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- labels -->
  <g fill="#98a1b3" font-size="11.5" text-anchor="middle">
    <text x="94"  y="228">+0</text>
    <text x="202" y="228">+1 … +15</text>
    <text x="310" y="228">+T</text>
    <text x="418" y="228">+T1 … +T4</text>
    <text x="526" y="228">Awaken</text>
    <text x="634" y="228">Second Awaken</text>
  </g>

  <!-- internal LEVEL row -->
  <g fill="#4a5266" font-size="10" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="94"  y="246">L0</text>
    <text x="202" y="246">L1–15</text>
    <text x="310" y="246">L16</text>
    <text x="418" y="246">L17–20</text>
    <text x="526" y="246">L21</text>
    <text x="634" y="246">no row</text>
  </g>

  <!-- callout on +T -->
  <rect x="252" y="60" width="116" height="34" rx="7" fill="#171a21" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="310" y="75" fill="#e6e8ee" font-size="11" text-anchor="middle" font-weight="600">+T ≠ +T1</text>
  <text x="310" y="88" fill="#98a1b3" font-size="9.5" text-anchor="middle">consecutive rungs</text>
  <line x1="310" y1="94" x2="310" y2="114" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="3 3"/>
</svg>
