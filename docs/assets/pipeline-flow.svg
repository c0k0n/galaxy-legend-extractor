<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 920 240" width="920" height="240"
     font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>The extraction pipeline, animated</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6478"/>
    </marker>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="920" height="240" fill="#0f1115"/>
  <text x="24" y="26" fill="#e6e8ee" font-size="14" font-weight="600">Raw game files → published data</text>
  <text x="24" y="44" fill="#6b7488" font-size="11">Each pulse is one record moving through a stage.</text>

  <!-- connectors -->
  <g fill="none" stroke="#3a4252" stroke-width="1.6" marker-end="url(#arrow)">
    <path id="p1" d="M192,67 C 225,67 215,129 250,129"/>
    <path id="p2" d="M192,129 L250,129"/>
    <path id="p3" d="M192,191 C 225,191 215,129 250,129"/>
    <path id="p4" d="M420,129 L470,129"/>
    <path id="p5" d="M650,129 C 685,129 675,67 710,67"/>
    <path id="p6" d="M650,129 L710,129"/>
    <path id="p7" d="M650,129 C 685,129 675,191 710,191"/>
  </g>

  <!-- sources -->
  <g>
    <rect x="24" y="44"  width="168" height="46" rx="8" fill="#171a21" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="40" y="66"  fill="#e6e8ee" font-size="12.5" font-weight="600">data1.pak</text>
    <text x="40" y="82"  fill="#98a1b3" font-size="10.5">zlib Lua tables</text>

    <rect x="24" y="106" width="168" height="46" rx="8" fill="#171a21" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="40" y="128" fill="#e6e8ee" font-size="12.5" font-weight="600">*.tfl</text>
    <text x="40" y="144" fill="#98a1b3" font-size="10.5">encrypted bytecode</text>

    <rect x="24" y="168" width="168" height="46" rx="8" fill="#171a21" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="40" y="190" fill="#e6e8ee" font-size="12.5" font-weight="600">tap4fun.zip</text>
    <text x="40" y="206" fill="#98a1b3" font-size="10.5">loc tables</text>
  </g>

  <!-- stage 1-4 -->
  <rect x="250" y="106" width="170" height="46" rx="8" fill="#171a21" stroke="#7dd3fc" stroke-width="1.4"/>
  <text x="266" y="126" fill="#e6e8ee" font-size="12.5" font-weight="600">extract · decrypt · parse</text>
  <text x="266" y="142" fill="#98a1b3" font-size="10.5">stages 1 – 4</text>

  <!-- stage 5 -->
  <rect x="470" y="106" width="180" height="46" rx="8" fill="#171a21" stroke="#7dd3fc" stroke-width="1.4"/>
  <text x="486" y="126" fill="#e6e8ee" font-size="12.5" font-weight="600">build_sss_db.py</text>
  <text x="486" y="142" fill="#98a1b3" font-size="10.5">join · group by slot</text>

  <!-- outputs -->
  <g>
    <rect x="710" y="44"  width="186" height="46" rx="8" fill="#171a21" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="726" y="66"  fill="#e6e8ee" font-size="12.5" font-weight="600">sss_database.json</text>
    <text x="726" y="82"  fill="#98a1b3" font-size="10.5">194 heroes</text>

    <rect x="710" y="106" width="186" height="46" rx="8" fill="#171a21" stroke="#4ade80" stroke-width="1.4"/>
    <text x="726" y="128" fill="#e6e8ee" font-size="12.5" font-weight="600">by_class/ · llm/</text>
    <text x="726" y="144" fill="#98a1b3" font-size="10.5">6 roles, JSON + Markdown</text>

    <rect x="710" y="168" width="186" height="46" rx="8" fill="#171a21" stroke="#4ade80" stroke-width="1.4"/>
    <text x="726" y="190" fill="#e6e8ee" font-size="12.5" font-weight="600">docs/heroes.html</text>
    <text x="726" y="206" fill="#98a1b3" font-size="10.5">browsable handbook</text>
  </g>

  <!-- travelling pulses -->
  <g>
    <circle r="4.5" fill="url(#dot)">
      <animateMotion dur="2.6s" repeatCount="indefinite" begin="0s">
        <mpath xlink:href="#p1" href="#p1"/>
      </animateMotion>
    </circle>
    <circle r="4.5" fill="url(#dot)">
      <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.35s">
        <mpath xlink:href="#p2" href="#p2"/>
      </animateMotion>
    </circle>
    <circle r="4.5" fill="url(#dot)">
      <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.7s">
        <mpath xlink:href="#p3" href="#p3"/>
      </animateMotion>
    </circle>
    <circle r="4.5" fill="url(#dot)">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.1s">
        <mpath xlink:href="#p4" href="#p4"/>
      </animateMotion>
    </circle>
    <circle r="4.5" fill="url(#dot)">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.5s">
        <mpath xlink:href="#p5" href="#p5"/>
      </animateMotion>
    </circle>
    <circle r="4.5" fill="url(#dot)">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.8s">
        <mpath xlink:href="#p6" href="#p6"/>
      </animateMotion>
    </circle>
    <circle r="4.5" fill="url(#dot)">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="2.1s">
        <mpath xlink:href="#p7" href="#p7"/>
      </animateMotion>
    </circle>
  </g>

  <!-- breathing highlight on the join stage -->
  <rect x="470" y="106" width="180" height="46" rx="8" fill="none" stroke="#7dd3fc" stroke-width="2.4" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="2.6s" repeatCount="indefinite" begin="1.1s"/>
  </rect>
</svg>
