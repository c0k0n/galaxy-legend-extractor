<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 660 250" width="660" height="250"
     font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>The .tfl block cipher: rotate first, then XOR</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6478"/>
    </marker>
  </defs>

  <rect width="660" height="250" fill="#0f1115"/>
  <text x="24" y="26" fill="#e6e8ee" font-size="14" font-weight="600">.tfl — one 4-byte block</text>
  <text x="24" y="44" fill="#6b7488" font-size="11">Rotate happens first, XOR second. Get the order wrong and every byte is garbage.</text>

  <!-- ciphertext -->
  <rect x="24" y="80" width="118" height="66" rx="8" fill="#171a21" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="38" y="100" fill="#e6e8ee" font-size="12" font-weight="600">ciphertext</text>
  <g>
    <rect x="38" y="110" width="20" height="22" rx="3" fill="#a78bfa" opacity="0.85"/>
    <rect x="62" y="110" width="20" height="22" rx="3" fill="#f472b6" opacity="0.85"/>
    <rect x="86" y="110" width="20" height="22" rx="3" fill="#60a5fa" opacity="0.85"/>
    <rect x="110" y="110" width="20" height="22" rx="3" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- rotate -->
  <g>
    <circle cx="232" cy="113" r="42" fill="none" stroke="#3a4252" stroke-width="1.4" stroke-dasharray="4 4"/>
    <g>
      <rect x="212" y="93" width="40" height="40" rx="5" fill="#7dd3fc" opacity="0.9"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 232 113" to="360 232 113" dur="4s" repeatCount="indefinite"/>
    </g>
    <text x="232" y="176" fill="#98a1b3" font-size="11" text-anchor="middle">1 · ROL / ROR</text>
    <text x="232" y="191" fill="#6b7488" font-size="10" text-anchor="middle">dir, rot from PRNG</text>
  </g>

  <!-- xor -->
  <rect x="330" y="80" width="118" height="66" rx="8" fill="#171a21" stroke="#f87171" stroke-width="1.4"/>
  <text x="344" y="100" fill="#e6e8ee" font-size="12" font-weight="600">XOR mask</text>
  <g>
    <rect x="344" y="110" width="20" height="22" rx="3" fill="#98a1b3">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect x="368" y="110" width="20" height="22" rx="3" fill="#98a1b3">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite" begin="0.2s"/>
    </rect>
    <rect x="392" y="110" width="20" height="22" rx="3" fill="#98a1b3">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
    <rect x="416" y="110" width="20" height="22" rx="3" fill="#98a1b3">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
  </g>
  <text x="389" y="176" fill="#98a1b3" font-size="11" text-anchor="middle">2 · XOR</text>

  <!-- plaintext -->
  <rect x="504" y="80" width="132" height="66" rx="8" fill="#171a21" stroke="#4ade80" stroke-width="1.4"/>
  <text x="518" y="100" fill="#e6e8ee" font-size="12" font-weight="600">plaintext</text>
  <text x="518" y="122" fill="#4ade80" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">1b 4c 75 61</text>
  <text x="518" y="138" fill="#6b7488" font-size="10">= \x1bLua…</text>

  <!-- arrows -->
  <g fill="none" stroke="#3a4252" stroke-width="1.6" marker-end="url(#arrow)">
    <path id="a1" d="M142,113 L188,113"/>
    <path id="a2" d="M276,113 L328,113"/>
    <path id="a3" d="M448,113 L502,113"/>
  </g>
  <g>
    <circle r="4" fill="#7dd3fc">
      <animateMotion dur="1.4s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#a1" href="#a1"/></animateMotion>
    </circle>
    <circle r="4" fill="#f87171">
      <animateMotion dur="1.4s" repeatCount="indefinite" begin="0.5s"><mpath xlink:href="#a2" href="#a2"/></animateMotion>
    </circle>
    <circle r="4" fill="#4ade80">
      <animateMotion dur="1.4s" repeatCount="indefinite" begin="1s"><mpath xlink:href="#a3" href="#a3"/></animateMotion>
    </circle>
  </g>

  <!-- PRNG -->
  <rect x="196" y="204" width="268" height="34" rx="8" fill="#171a21" stroke="#3a4252" stroke-width="1.2"/>
  <text x="330" y="225" fill="#98a1b3" font-size="11.5" text-anchor="middle">LCG PRNG · seed 0x0003857A · draws dir, rot, mask</text>
  <g fill="none" stroke="#3a4252" stroke-width="1.2" stroke-dasharray="5 4">
    <path d="M250,204 C 250,180 232,170 232,158">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M410,204 C 410,180 389,170 389,150">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
